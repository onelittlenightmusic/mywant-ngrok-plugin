recipe:
  metadata:
    name: "Ngrok Tunnel"
    description: |
      Exposes a local service via a public URL using ngrok.

      Starts an ngrok process, waits for the forwarding URL to appear in its output,
      and stores it in state as `server_url` (also exposed as `final_result`).

      Requirements:
        - ngrok must be installed and available in PATH
        - For persistent URLs, configure ngrok authtoken beforehand

      Usage:
        mywant recipes list
        mywant wants create --recipe "Ngrok Tunnel" -p port=3000

    custom_type: "ngrok"
    category: "tunnel"
    version: "1.0.0"

  parameters:
    port: "8080"
    protocol: "http"
    command: "ngrok"
    args: '["http", "8080", "--log", "stdout"]'
    url_regex: '(?:Forwarding\s+|url=)(https?://\S+)'
    result_field: "server_url"
    max_retries: 30
    log_file: ""

  parameter_descriptions:
    port: "Local port to expose"
    protocol: "Protocol for the tunnel (http, tcp, tls)"
    command: "Path to ngrok binary"
    args: "CLI arguments as JSON array"
    url_regex: "Regex to extract the forwarding URL from logs"
    result_field: "State field name to store the extracted URL"
    max_retries: "Max retries waiting for the forwarding URL"
    log_file: "Path to capture ngrok stdout (auto-generated if empty)"

  wants:
    - metadata:
        type: managed_process
        labels:
          role: tunnel
          provider: ngrok
      spec:
        params:
          command: command
          args: args
          url_regex: url_regex
          result_field: result_field
          max_retries: max_retries
          log_file: log_file

  example:
    wants:
      - metadata:
          name: "ngrok-tunnel"
          type: "ngrok"
          labels:
            recipe: "Ngrok Tunnel"
        spec:
          params:
            port: "3000"
